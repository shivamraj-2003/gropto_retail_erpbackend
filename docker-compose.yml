# Production-style stack. Redis is Upstash (managed) and Postgres is Supabase
# (managed), so neither runs here — both come from .env.
#
#   docker compose run --rm migrate      # apply DB migrations (each release)
#   docker compose up -d api worker      # serve + process notifications
#   curl localhost:8000/health/ready     # DB + Redis readiness
#
# Put a TLS-terminating proxy (Caddy, Nginx, a cloud LB) in front of `api`.
services:
  api:
    build: .
    env_file: .env
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    env_file: .env
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4", "-Q", "notifications"]
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    profiles: ["tools"]

  backup:
    build: .
    env_file: .env
    command: ["python", "-m", "scripts.backup_db", "--dir", "/backups", "--keep-days", "14"]
    volumes:
      - ./backups:/backups
    profiles: ["tools"]
