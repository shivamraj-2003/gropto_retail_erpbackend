# Production stack on the VPS (copied to /opt/gropto by the deploy workflow).
# The API image comes from GitHub Container Registry; Postgres is a managed service (Supabase). Here run the API, the Caddy TLS
# proxy and, only when wanted, the Celery worker (profile "worker") and a Redis (profile "redis"). With one API process the app
# needs no Redis at all: rate limits and lockouts are kept in memory, which is correct for a single process.
# Configuration is /opt/gropto/.env.
#
# IMAGE is set by remote-deploy.sh, e.g. ghcr.io/<owner>/<repo>:<commit sha>.
services:
  api:
    image: ${IMAGE:?set IMAGE}
    env_file: .env
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Sends SMS / WhatsApp / email in the background. Not started unless REDIS_URL is set and CELERY_ENABLED is not false
  # (remote-deploy.sh decides). It polls Redis all day, so leave it off until a message provider is set up.
  worker:
    image: ${IMAGE:?set IMAGE}
    env_file: .env
    profiles: ["worker"]
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4", "-Q", "notifications"]
    restart: unless-stopped

  # A Redis on this server instead of Upstash: no request limit, no cost. To use it set REDIS_URL=redis://redis:6379/0 in .env and
  # start it with:  docker compose -f docker-compose.prod.yml --profile redis up -d redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    profiles: ["redis"]
    restart: unless-stopped

  migrate:
    image: ${IMAGE:?set IMAGE}
    env_file: .env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    profiles: ["tools"]

  backup:
    image: ${IMAGE:?set IMAGE}
    env_file: .env
    command: ["python", "-m", "scripts.backup_db", "--dir", "/backups", "--keep-days", "14"]
    volumes:
      - ./backups:/backups
    profiles: ["tools"]

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      # A domain name (HTTPS is automatic) or ":80" for plain HTTP on the server's IP until a domain is ready.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
